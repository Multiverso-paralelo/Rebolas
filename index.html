<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tierlist - Hytechpixel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
        }

        /* BARRA DE FERRAMENTAS */
        .toolbar {
            width: 100%;
            max-width: 1100px;
            background: #141721;
            border: 1px solid #232838;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn {
            background: #1f2433;
            color: #fff;
            border: 1px solid #363e57;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .btn-upload { background: #00d26a; color: #000; border: none; }
        .btn-download { background: #00b4db; color: #fff; border: none; }
        .btn-clear { background: #d90429; color: #fff; border: none; }

        /* ÁREA DA TIERLIST */
        #export-area {
            width: 100%;
            max-width: 1100px;
            background: #0d0f14;
            background-image: 
                radial-gradient(#1c202d 15%, transparent 16%), 
                radial-gradient(#1c202d 15%, transparent 16%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
            border: 2px solid #1f2433;
            border-radius: 8px;
            padding: 16px;
        }

        /* CABEÇALHO */
        .tier-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222838;
            padding-bottom: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
            outline: none;
            color: #ffffff;
            text-transform: uppercase;
        }

        .credits-box {
            text-align: right;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .credits-name {
            color: #00ff88;
            font-weight: 900;
        }

        .date-text {
            color: #00d2ff;
            font-size: 13px;
            font-weight: 700;
        }

        /* LISTA DAS TIERS */
        .tier-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tier-row {
            display: flex;
            min-height: 80px;
            background: rgba(13, 15, 20, 0.95);
            border: 1.5px solid #1f2535;
            border-radius: 6px;
            overflow: hidden;
        }

        .tier-badge {
            width: 140px;
            min-width: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 8px;
            color: #ffffff;
            text-shadow: 1px 1px 3px #000;
            border-right: 2px solid #1f2535;
        }

        /* CORES DAS TIERS */
        .tier-top10    { background: linear-gradient(135deg, #b8860b, #ffd700); color: #000; text-shadow: none; font-size: 16px; }
        .tier-overall  { background: linear-gradient(135deg, #7b1127, #e63946); }
        .tier-submeta  { background: linear-gradient(135deg, #4a0e4e, #9d4edd); }
        .tier-decent   { background: linear-gradient(135deg, #0b3c5d, #3282b8); }
        .tier-msupport { background: linear-gradient(135deg, #1b4332, #2d6a4f); }
        .tier-support  { background: linear-gradient(135deg, #134e5e, #71b280); }
        .tier-buffers  { background: linear-gradient(135deg, #543d2b, #8a6240); }

        .tier-dropzone {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px;
            align-items: center;
            min-height: 75px;
            background: rgba(0, 0, 0, 0.4);
        }

        /* CARDS DAS IMAGENS */
        .tier-card {
            width: 68px;
            height: 68px;
            border-radius: 4px;
            background: #000;
            border: 1px solid #363e57;
            position: relative;
            cursor: grab;
            touch-action: none;
        }

        .tier-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
            pointer-events: none;
        }

        .tier-card .del-btn {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff0055;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* BANCO DE IMAGENS */
        .pool-container {
            width: 100%;
            max-width: 1100px;
            background: #141721;
            border: 1px solid #232838;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
        }

        .pool-header {
            font-size: 13px;
            font-weight: 800;
            color: #8f96a3;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .pool-zone {
            min-height: 80px;
            background: #0a0b0e;
            border: 2px dashed #282f42;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* MODAL DE VISUALIZAÇÃO/SALVAMENTO NO CELULAR */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-content {
            background: #181a24;
            border: 2px solid #00b4db;
            border-radius: 10px;
            padding: 15px;
            max-width: 95%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            overflow-y: auto;
        }

        .modal-content img {
            max-width: 100%;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .modal-tip {
            font-size: 13px;
            color: #00ff88;
            text-align: center;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .tier-badge {
                width: 95px;
                min-width: 95px;
                font-size: 12px;
                padding: 4px;
            }
            .tier-card {
                width: 52px;
                height: 52px;
            }
            .main-title {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <!-- BOTÕES -->
    <div class="toolbar">
        <label class="btn btn-upload">
            📁 + Adicionar Imagens
            <input type="file" id="filePicker" multiple accept="image/*" style="display: none;">
        </label>
        <button class="btn btn-clear" id="clearBtn">Limpar Fotos</button>
        <button class="btn btn-download" id="downloadBtn">📸 Baixar Imagem HD (.PNG)</button>
    </div>

    <!-- TIERLIST -->
    <div id="export-area">
        <div class="tier-header">
            <div class="main-title" contenteditable="true">TIERLIST OFICIAL</div>
            <div class="credits-box">
                <div>CREDITS: <span class="credits-name">HYTECHPIXEL</span></div>
                <div class="date-text" id="dateDisplay"></div>
            </div>
        </div>

        <div class="tier-list">
            <div class="tier-row">
                <div class="tier-badge tier-top10" contenteditable="true">Top 10</div>
                <div class="tier-dropzone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-overall" contenteditable="true">Overall Meta</div>
                <div class="tier-dropzone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-submeta" contenteditable="true">Sub-Meta</div>
                <div class="tier-dropzone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-decent" contenteditable="true">Decent</div>
                <div class="tier-dropzone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-msupport" contenteditable="true">Meta Support</div>
                <div class="tier-dropzone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-support" contenteditable="true">Support</div>
                <div class="tier-dropzone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-buffers" contenteditable="true">Buffers</div>
                <div class="tier-dropzone"></div>
            </div>
        </div>
    </div>

    <!-- BANCO DE IMAGENS -->
    <div class="pool-container">
        <div class="pool-header">📦 Fotos Importadas (Arraste para as Tiers acima)</div>
        <div class="pool-zone" id="imagePool"></div>
    </div>

    <!-- MODAL DE VISUALIZAÇÃO/DOWNLOAD SEGURO -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <div class="modal-tip">💡 Segure o dedo na foto abaixo e toque em "Fazer download da imagem" para salvar na sua galeria:</div>
            <img id="previewImg" src="" alt="Tierlist HD">
            <button class="btn btn-clear" onclick="document.getElementById('imageModal').style.display='none'">Fechar</button>
        </div>
    </div>

    <script>
        // Data atual
        const d = new Date();
        document.getElementById('dateDisplay').innerText = 
            `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;

        // Configuração Drag and Drop suave para Celular e PC
        const dropzones = document.querySelectorAll('.tier-dropzone, #imagePool');
        dropzones.forEach(zone => {
            new Sortable(zone, {
                group: 'tierlist',
                animation: 150,
                touchStartThreshold: 4,
                ghostClass: 'sortable-ghost'
            });
        });

        // Função Criar Card
        function addCard(src) {
            const card = document.createElement('div');
            card.className = 'tier-card';

            const img = document.createElement('img');
            img.src = src;

            const del = document.createElement('button');
            del.className = 'del-btn';
            del.innerText = '×';
            del.onclick = (e) => {
                e.stopPropagation();
                card.remove();
            };

            card.appendChild(img);
            card.appendChild(del);
            document.getElementById('imagePool').appendChild(card);
        }

        // Upload de Fotos
        const filePicker = document.getElementById('filePicker');
        filePicker.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => addCard(event.target.result);
                reader.readAsDataURL(file);
            });
            filePicker.value = '';
        });

        // Limpar fotos
        document.getElementById('clearBtn').onclick = () => {
            if (confirm('Remover todas as fotos?')) {
                document.querySelectorAll('.tier-card').forEach(el => el.remove());
            }
        };

        // Baixar Imagem HD (Compatível com Android / iOS e PC)
        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.onclick = () => {
            downloadBtn.innerText = '⏳ Gerando PNG...';
            downloadBtn.disabled = true;

            // Oculta botões de excluir antes de fotografar
            const deleteButtons = document.querySelectorAll('.del-btn');
            deleteButtons.forEach(b => b.style.display = 'none');

            const exportArea = document.getElementById('export-area');

            html2canvas(exportArea, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#0d0f14',
                logging: false
            }).then(canvas => {
                deleteButtons.forEach(b => b.style.display = 'flex');
                downloadBtn.innerText = '📸 Baixar Imagem HD (.PNG)';
                downloadBtn.disabled = false;

                canvas.toBlob((blob) => {
                    if (!blob) return;

                    const imgURL = URL.createObjectURL(blob);

                    // Tenta o download direto
                    const a = document.createElement('a');
                    a.href = imgURL;
                    a.download = `tierlist-hytechpixel-${Date.now()}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    // Abre o modal de garantia no celular caso o Chrome bloqueie o arquivo direto
                    document.getElementById('previewImg').src = imgURL;
                    document.getElementById('imageModal').style.display = 'flex';
                }, 'image/png');

            }).catch(err => {
                deleteButtons.forEach(b => b.style.display = 'flex');
                downloadBtn.innerText = '📸 Baixar Imagem HD (.PNG)';
                downloadBtn.disabled = false;
                alert('Erro ao gerar imagem: ' + err);
            });
        };
    </script>
</body>
</html>

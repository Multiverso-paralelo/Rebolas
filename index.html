<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Tierlist Maker HD</title>
    <!-- Fontes Estilo Gamer/Moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bibliotecas externas: Drag & Drop + Captura em Alta Resolução -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-main: #0c0d10;
            --panel-bg: #13151b;
            --border-color: #232733;
            --accent-cyan: #00e5ff;
            --accent-red: #ff3366;
            --accent-green: #00ff88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* BARRA DE CONTROLE SUPERIOR (NÃO SAI NO EXPORT) */
        .controls-toolbar {
            width: 100%;
            max-width: 1400px;
            background: #181a22;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .btn {
            background: #252a38;
            color: #fff;
            border: 1px solid #363d50;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background: #32384a;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .btn-download {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            border: none;
            color: white;
        }
        .btn-download:hover {
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.6);
        }

        .btn-danger {
            background: #44151e;
            border-color: #691e2e;
            color: #ff99aa;
        }
        .btn-danger:hover {
            background: #631d2b;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }

        input[type="file"] {
            display: none;
        }

        /* ÁREA PRINCIPAL DA TIER LIST (ESTILO SDR EXATO) */
        #tierlist-canvas {
            width: 1400px;
            background: #0f1015;
            background-image: 
                radial-gradient(#1f222e 15%, transparent 16%), 
                radial-gradient(#1f222e 15%, transparent 16%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            border: 4px solid #1a1c24;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            position: relative;
        }

        /* CABEÇALHO */
        .tier-header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #202430;
            padding-bottom: 15px;
        }

        .logo-box {
            width: 70px;
            height: 70px;
            background: #000;
            border-radius: 50%;
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title-meta-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            outline: none;
            color: #ffffff;
            text-shadow: 2px 2px 0px #000;
        }

        .main-title span {
            font-weight: 700;
            font-size: 22px;
            color: #aaa;
        }

        .discord-tag {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #5865f2;
            display: flex;
            align-items: center;
            gap: 6px;
            outline: none;
        }

        .right-meta-info {
            text-align: right;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .date-badge {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: #00e5ff;
            outline: none;
            margin-bottom: 4px;
        }

        .credits-list {
            color: #8f96a3;
            outline: none;
        }
        .credits-list b { color: #00ff88; }
        .credits-list i { color: #ff3366; font-style: normal; }

        /* GRID DAS COLUNAS DUPLAS (LADO ESQUERDO E DIREITO) */
        .tier-columns-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .tier-column {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* LINHA DA TIER */
        .tier-row {
            display: flex;
            background: rgba(8, 9, 12, 0.95);
            border: 2px solid #1a1c24;
            border-radius: 4px;
            min-height: 84px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* EMBLEMA DA TIER */
        .tier-badge {
            width: 80px;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            border-right: 2px solid #1a1c24;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        /* Cores temáticas das Tiers */
        .tier-X   { background: linear-gradient(135deg, #1b263b, #415a77); border-left: 6px solid #64dfdf; }
        .tier-SS  { background: linear-gradient(135deg, #2b0938, #5a189a); border-left: 6px solid #e0aaff; }
        .tier-Sp  { background: linear-gradient(135deg, #49111c, #800f2f); border-left: 6px solid #ff4d6d; }
        .tier-S   { background: linear-gradient(135deg, #44360e, #856214); border-left: 6px solid #ffb703; }
        .tier-A   { background: linear-gradient(135deg, #183324, #2d6a4f); border-left: 6px solid #52b788; }
        .tier-B   { background: linear-gradient(135deg, #132a3e, #1f4e78); border-left: 6px solid #48cae4; }

        .tier-Bm  { background: linear-gradient(135deg, #232d3f, #32435f); border-left: 6px solid #90e0ef; }
        .tier-C   { background: linear-gradient(135deg, #222b17, #475b28); border-left: 6px solid #99d98c; }
        .tier-D   { background: linear-gradient(135deg, #3d2c16, #745124); border-left: 6px solid #dda15e; }
        .tier-E   { background: linear-gradient(135deg, #421e16, #7c3624); border-left: 6px solid #f07167; }
        .tier-F   { background: linear-gradient(135deg, #281919, #4a2424); border-left: 6px solid #d90429; }
        .tier-G   { background: linear-gradient(135deg, #1b1b1f, #2b2b36); border-left: 6px solid #6c757d; }

        /* ÁREA ONDE FICAM AS FOTOS */
        .tier-dropzone {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 4px;
            align-items: center;
            background: 
                radial-gradient(#1a1c24 20%, transparent 20%),
                radial-gradient(#1a1c24 20%, transparent 20%);
            background-size: 8px 8px;
            background-position: 0 0, 4px 4px;
            min-height: 80px;
        }

        /* CARD DE CADA IMAGEM */
        .tier-card {
            width: 74px;
            height: 74px;
            border-radius: 4px;
            background: #000;
            border: 1px solid #363a48;
            cursor: grab;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s ease, border-color 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .tier-card:active {
            cursor: grabbing;
        }

        .tier-card:hover {
            border-color: var(--accent-cyan);
            transform: scale(1.05);
            z-index: 10;
        }

        .tier-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .tier-card .delete-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(255, 0, 55, 0.9);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tier-card:hover .delete-btn {
            display: flex;
        }

        /* BANCO DE IMAGENS (POOL) */
        .image-pool-section {
            width: 100%;
            max-width: 1400px;
            background: #13151b;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 20px;
        }

        .image-pool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #8f96a3;
            text-transform: uppercase;
            font-weight: 700;
        }

        .pool-dropzone {
            min-height: 100px;
            background: #0a0b0e;
            border: 2px dashed #242938;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* Dica visual de edição */
        [contenteditable="true"] {
            border-radius: 4px;
            padding: 2px 6px;
            transition: background 0.2s;
        }
        [contenteditable="true"]:hover {
            background: rgba(255, 255, 255, 0.08);
            outline: 1px dashed rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- BARRA DE FERRAMENTAS SUPERIOR -->
    <div class="controls-toolbar">
        <div style="display: flex; gap: 10px;">
            <label class="btn">
                📁 Importar Fotos (Lote)
                <input type="file" id="imageInput" multiple accept="image/*">
            </label>
            <button class="btn btn-danger" id="clearBoardBtn">🗑️ Limpar Tudo</button>
        </div>

        <div style="color: #7b8396; font-size: 13px;">
            💡 <i>Dica: Clique nos textos e na Logo do cabeçalho para editar direto na tela!</i>
        </div>

        <div>
            <button class="btn btn-download" id="downloadBtn">📸 Baixar Imagem HD (.PNG)</button>
        </div>
    </div>

    <!-- QUADRO EXPORTÁVEL (A TIER LIST EM SI) -->
    <div id="tierlist-canvas">
        <!-- CABEÇALHO COM ESTILO SDR -->
        <div class="tier-header">
            <div class="logo-box" id="logoBox" title="Clique para trocar a logo">
                <span id="logoText">SDR</span>
                <input type="file" id="logoInput" accept="image/*" style="display: none;">
            </div>

            <div class="title-meta-box">
                <div class="main-title" contenteditable="true">OVERALL & UTILITY TIERLIST <span contenteditable="true">by SDR</span></div>
                <div class="discord-tag" contenteditable="true">🌐 discord.gg/sdr</div>
            </div>

            <div class="right-meta-info">
                <div class="date-badge" contenteditable="true" id="currentDate">13.10.2024</div>
                <div class="credits-list" contenteditable="true">
                    CREDITS: <b>rtwoh</b> • <b>ashnleigh</b> • <i>staff</i>
                </div>
            </div>
        </div>

        <!-- COLUNAS DE TIERS (ESQUERDA E DIREITA) -->
        <div class="tier-columns-container">
            <!-- COLUNA ESQUERDA -->
            <div class="tier-column">
                <div class="tier-row">
                    <div class="tier-badge tier-X" contenteditable="true">X</div>
                    <div class="tier-dropzone" data-tier="X"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-badge tier-SS" contenteditable="true">SS</div>
                    <div class="tier-dropzone" data-tier="SS"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-badge tier-Sp" contenteditable="true">S+</div>
                    <div class="tier-dropzone" data-tier="S+"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-badge tier-S" contenteditable="true">S</div>
                    <div class="tier-dropzone" data-tier="S"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-badge tier-A" contenteditable="true">A</div>
                    <div class="tier-dropzone" data-tier="A"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-badge tier-B" contenteditable="true">B</div>
                    <div class="tier-dropzone" data-tier="B"></div>
                </div>
            </div>

            <!-- COLUNA DIREITA -->
            <div class="tier-column">
                <div class="tier-row">
                    <div class="tier-badge tier-Bm" contenteditable="true">B-</div>
                    <div class="tier-dropzone" data-tier="B-"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-badge tier-C" contenteditable="true">C</div>
                    <div class="tier-dropzone" data-tier="C"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-badge tier-D" contenteditable="true">D</div>
                    <div class="tier-dropzone" data-tier="D"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-badge tier-E" contenteditable="true">E</div>
                    <div class="tier-dropzone" data-tier="E"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-badge tier-F" contenteditable="true">F</div>
                    <div class="tier-dropzone" data-tier="F"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-badge tier-G" contenteditable="true">G</div>
                    <div class="tier-dropzone" data-tier="G"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- BANCO DE IMAGENS NÃO UTILIZADAS (ESTOQUE) -->
    <div class="image-pool-section">
        <div class="image-pool-header">
            <span>📦 Estoque de Imagens (Arraste para as Tiers acima)</span>
            <span id="poolCounter">0 imagens</span>
        </div>
        <div class="pool-dropzone" id="poolZone"></div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Data Atual Automática formatada
        const dateElem = document.getElementById('currentDate');
        const now = new Date();
        dateElem.innerText = `${String(now.getDate()).padStart(2, '0')}.${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear()}`;

        // Configuração Drag and Drop (SortableJS)
        const dropzones = document.querySelectorAll('.tier-dropzone, #poolZone');
        dropzones.forEach(zone => {
            new Sortable(zone, {
                group: 'tierlist',
                animation: 180,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                dragClass: 'sortable-drag'
            });
        });

        // Função para Criar um Card de Imagem
        function createTierCard(imageSrc) {
            const card = document.createElement('div');
            card.className = 'tier-card';

            const img = document.createElement('img');
            img.src = imageSrc;

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '✕';
            delBtn.title = 'Remover Imagem';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                card.remove();
                updateCounter();
            };

            card.appendChild(img);
            card.appendChild(delBtn);
            return card;
        }

        // Upload em Lote de Imagens
        const imageInput = document.getElementById('imageInput');
        const poolZone = document.getElementById('poolZone');

        imageInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const card = createTierCard(event.target.result);
                        poolZone.appendChild(card);
                        updateCounter();
                    };
                    reader.readAsDataURL(file);
                }
            });
            imageInput.value = '';
        });

        function updateCounter() {
            const total = document.querySelectorAll('.tier-card').length;
            document.getElementById('poolCounter').innerText = `${total} imagens no total`;
        }

        // Troca de Logo Fácil
        const logoBox = document.getElementById('logoBox');
        const logoInput = document.getElementById('logoInput');

        logoBox.addEventListener('click', () => logoInput.click());
        logoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    logoBox.innerHTML = `<img src="${event.target.result}">`;

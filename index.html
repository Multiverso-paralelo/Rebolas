<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tierlist - Hytechpixel</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Impact, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            min-height: 100vh;
        }

        /* BARRA DE FERRAMENTAS */
        .toolbar {
            width: 100%;
            max-width: 1100px;
            background: #141721;
            border: 1px solid #232838;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .btn {
            position: relative;
            background: #1f2433;
            color: #fff;
            border: 1px solid #363e57;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            overflow: hidden;
        }

        .btn-upload {
            background: #00d26a;
            color: #000;
            border: none;
        }

        /* O INPUT FICA EXATAMENTE EM CIMA DO BOTÃO (NÃO FALHA NO ANDROID) */
        .btn-upload input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .btn-download { background: #00b4db; color: #fff; border: none; }
        .btn-clear { background: #d90429; color: #fff; border: none; }

        /* QUADRO DA TIERLIST */
        #export-area {
            width: 100%;
            max-width: 1100px;
            background: #0d0f14;
            background-image: 
                radial-gradient(#1c202d 15%, transparent 16%), 
                radial-gradient(#1c202d 15%, transparent 16%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
            border: 2px solid #1f2433;
            border-radius: 8px;
            padding: 14px;
        }

        /* CABEÇALHO */
        .tier-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222838;
            padding-bottom: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .main-title {
            font-size: 22px;
            font-weight: 900;
            font-style: italic;
            outline: none;
            color: #ffffff;
            text-transform: uppercase;
        }

        .credits-box {
            text-align: right;
            font-weight: 800;
            font-size: 14px;
        }

        .credits-name {
            color: #00ff88;
            font-weight: 900;
            outline: none;
        }

        .date-text {
            color: #00d2ff;
            font-size: 12px;
            font-weight: 700;
            outline: none;
        }

        /* LISTA DAS TIERS */
        .tier-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .tier-row {
            display: flex;
            min-height: 75px;
            background: rgba(13, 15, 20, 0.95);
            border: 1.5px solid #1f2535;
            border-radius: 6px;
            overflow: hidden;
        }

        .tier-badge {
            width: 130px;
            min-width: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 6px;
            color: #ffffff;
            text-shadow: 1px 1px 3px #000;
            border-right: 2px solid #1f2535;
            outline: none;
        }

        /* CORES DAS TIERS */
        .tier-top10    { background: linear-gradient(135deg, #b8860b, #ffd700); color: #000; text-shadow: none; font-size: 15px; }
        .tier-overall  { background: linear-gradient(135deg, #7b1127, #e63946); }
        .tier-submeta  { background: linear-gradient(135deg, #4a0e4e, #9d4edd); }
        .tier-decent   { background: linear-gradient(135deg, #0b3c5d, #3282b8); }
        .tier-msupport { background: linear-gradient(135deg, #1b4332, #2d6a4f); }
        .tier-support  { background: linear-gradient(135deg, #134e5e, #71b280); }
        .tier-buffers  { background: linear-gradient(135deg, #543d2b, #8a6240); }

        .tier-dropzone {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 5px;
            align-items: center;
            min-height: 70px;
            background: rgba(0, 0, 0, 0.4);
        }

        /* CARDS */
        .tier-card {
            width: 64px;
            height: 64px;
            border-radius: 4px;
            background: #000;
            border: 1px solid #363e57;
            position: relative;
            cursor: grab;
            touch-action: none;
            flex-shrink: 0;
        }

        .tier-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
            pointer-events: none;
        }

        .tier-card .del-btn {
            position: absolute;

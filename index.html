<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tierlist - Hytechpixel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
        }

        /* BARRA DE FERRAMENTAS */
        .toolbar {
            width: 100%;
            max-width: 1100px;
            background: #141721;
            border: 1px solid #232838;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn {
            background: #1f2433;
            color: #fff;
            border: 1px solid #363e57;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .btn-upload { background: #00d26a; color: #000; border: none; }
        .btn-download { background: #00b4db; color: #fff; border: none; }
        .btn-clear { background: #d90429; color: #fff; border: none; }

        .save-indicator {
            font-size: 13px;
            color: #00ff88;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* ÁREA DA TIERLIST */
        #export-area {
            width: 100%;
            max-width: 1100px;
            background: #0d0f14;
            background-image: 
                radial-gradient(#1c202d 15%, transparent 16%), 
                radial-gradient(#1c202d 15%, transparent 16%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
            border: 2px solid #1f2433;
            border-radius: 8px;
            padding: 16px;
        }

        /* CABEÇALHO */
        .tier-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222838;
            padding-bottom: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
            outline: none;
            color: #ffffff;
            text-transform: uppercase;
        }

        .credits-box {
            text-align: right;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .credits-name {
            color: #00ff88;
            font-weight: 900;
            outline: none;
        }

        .date-text {
            color: #00d2ff;
            font-size: 13px;
            font-weight: 700;
            outline: none;
        }

        /* LISTA DAS TIERS */
        .tier-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tier-row {
            display: flex;
            min-height: 80px;
            background: rgba(13, 15, 20, 0.95);
            border: 1.5px solid #1f2535;
            border-radius: 6px;
            overflow: hidden;
        }

        .tier-badge {
            width: 140px;
            min-width: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 8px;
            color: #ffffff;
            text-shadow: 1px 1px 3px #000;
            border-right: 2px solid #1f2535;
            outline: none;
        }

        /* CORES DAS TIERS */
        .tier-top10    { background: linear-gradient(135deg, #b8860b, #ffd700); color: #000; text-shadow: none; font-size: 16px; }
        .tier-overall  { background: linear-gradient(135deg, #7b1127, #e63946); }
        .tier-submeta  { background: linear-gradient(135deg, #4a0e4e, #9d4edd); }
        .tier-decent   { background: linear-gradient(135deg, #0b3c5d, #3282b8); }
        .tier-msupport { background: linear-gradient(135deg, #1b4332, #2d6a4f); }
        .tier-support  { background: linear-gradient(135deg, #134e5e, #71b280); }
        .tier-buffers  { background: linear-gradient(135deg, #543d2b, #8a6240); }

        .tier-dropzone {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px;
            align-items: center;
            min-height: 75px;
            background: rgba(0, 0, 0, 0.4);
        }

        /* CARDS DAS IMAGENS */
        .tier-card {
            width: 68px;
            height: 68px;
            border-radius: 4px;
            background: #000;
            border: 1px solid #363e57;
            position: relative;
            cursor: grab;
            touch-action: none;
        }

        .tier-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
            pointer-events: none;
        }

        .tier-card .del-btn {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff0055;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* BANCO DE IMAGENS */
        .pool-container {
            width: 100%;
            max-width: 1100px;
            background: #141721;
            border: 1px solid #232838;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
        }

        .pool-header {
            font-size: 13px;
            font-weight: 800;
            color: #8f96a3;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .pool-zone {
            min-height: 80px;
            background: #0a0b0e;
            border: 2px dashed #282f42;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* MODAL DE VISUALIZAÇÃO/SALVAMENTO NO CELULAR */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-content {
            background: #181a24;
            border: 2px solid #00b4db;
            border-radius: 10px;
            padding: 15px;
            max-width: 95%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            overflow-y: auto;
        }

        .modal-content img {
            max-width: 100%;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .modal-tip {
            font-size: 13px;
            color: #00ff88;
            text-align: center;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .tier-badge {
                width: 95px;
                min-width: 95px;
                font-size: 12px;
                padding: 4px;
            }
            .tier-card {
                width: 52px;
                height: 52px;
            }
            .main-title {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <!-- BOTÕES -->
    <div class="toolbar">
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <label class="btn btn-upload">
                📁 + Adicionar Imagens
                <input type="file" id="filePicker" multiple accept="image/*" style="display: none;">
            </label>
            <button class="btn btn-clear" id="clearBtn">Limpar Fotos</button>
        </div>
        
        <div class="save-indicator" id="saveIndicator">💾 Salvo automaticamente</div>

        <button class="btn btn-download" id="downloadBtn">📸 Baixar Imagem HD (.PNG)</button>
    </div>

    <!-- TIERLIST -->
    <div id="export-area">
        <div class="tier-header">
            <div class="main-title" id="mainTitle" contenteditable="true">TIERLIST OFICIAL</div>
            <div class="credits-box">
                <div>CREDITS: <span class="credits-name" id="creditsName" contenteditable="true">HYTECHPIXEL</span></div>
                <div class="date-text" id="dateDisplay" contenteditable="true"></div>
            </div>
        </div>

        <div class="tier-list">
            <div class="tier-row">
                <div class="tier-badge tier-top10" contenteditable="true">Top 10</div>
                <div class="tier-dropzone" data-tier-id="top10"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-overall" contenteditable="true">Overall Meta</div>
                <div class="tier-dropzone" data-tier-id="overall"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-submeta" contenteditable="true">Sub-Meta</div>
                <div class="tier-dropzone" data-tier-id="submeta"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-decent" contenteditable="true">Decent</div>
                <div class="tier-dropzone" data-tier-id="decent"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-msupport" contenteditable="true">Meta Support</div>
                <div class="tier-dropzone" data-tier-id="msupport"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-support" contenteditable="true">Support</div>
                <div class="tier-dropzone" data-tier-id="support"></div>
            </div>
            <div class="tier-row">
                <div class="tier-badge tier-buffers" contenteditable="true">Buffers</div>
                <div class="tier-dropzone" data-tier-id="buffers"></div>
            </div>
        </div>
    </div>

    <!-- BANCO DE IMAGENS -->
    <div class="pool-container">
        <div class="pool-header">📦 Fotos Importadas (Arraste para as Tiers acima)</div>
        <div class="pool-zone" id="imagePool"></div>
    </div>

    <!-- MODAL DE VISUALIZAÇÃO/DOWNLOAD SEGURO -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <div class="modal-tip">💡 Segure o dedo na foto abaixo e toque em "Fazer download da imagem" para salvar na sua galeria:</div>
            <img id="previewImg" src="" alt="Tierlist HD">
            <button class="btn btn-clear" onclick="document.getElementById('imageModal').style.display='none'">Fechar</button>
        </div>
    </div>

    <script>
        // ================= SISTEMA DE SALVAMENTO AUTOMÁTICO (INDEXEDDB) =================
        const DB_NAME = 'TierlistDB_Hytech';
        const STORE_NAME = 'app_state';

        function openDatabase() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveAllState() {
            const ind = document.getElementById('saveIndicator');
            ind.innerText = '⏳ Salvando...';
            ind.style.color = '#ffb703';

            const state = {
                title: document.getElementById('mainTitle').innerText,
                credits: document.getElementById('creditsName').innerText,
                date: document.getElementById('dateDisplay').innerText,
                tiers: {},
                pool: []
            };

            // Salva os badges e fotos de cada tier
            document.querySelectorAll('.tier-row').forEach(row => {
                const badge = row.querySelector('.tier-badge');
                const dropzone = row.querySelector('.tier-dropzone');
                const tierId = dropzone.getAttribute('data-tier-id');
                const images = [];
                dropzone.querySelectorAll('.tier-card img').forEach(img => images.push(img.src));

                state.tiers[tierId] = {
                    badgeText: badge.innerText,
                    images: images
                };
            });

            // Salva fotos do estoque
            document.querySelectorAll('#imagePool .tier-card img').forEach(img => {
                state.pool.push(img.src);
            });

            try {
                const db = await openDatabase();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(state, 'savedState');
                setTimeout(() => {
                    ind.innerText = '💾 Salvo automaticamente';
                    ind.style.color = '#00ff88';
                }, 300);
            } catch (e) {
                console.error('Erro ao salvar:', e);
            }
        }

        async function loadState() {
            try {
                const db = await openDatabase();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).get('savedState');

                req.onsuccess = () => {
                    const state = req.result;
                    if (!state) {
                        // Data padrão se primeira vez
                        const d = new Date();
                        document.getElementById('dateDisplay').innerText = 
                            `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
                        return;
                    }

                    // Restaura textos
                    if (state.title) document.getElementById('mainTitle').innerText = state.title;
                    if (state.credits) document.getElementById('creditsName').innerText = state.credits;
                    if (state.date) document.getElementById('dateDisplay').innerText = state.date;

                    // Restaura Tiers
                    if (state.tiers) {
                        document.querySelectorAll('.tier-row').forEach(row => {
                            const dropzone = row.querySelector('.tier-dropzone');
                            const badge = row.querySelector('.tier-badge');
                            const tierId = dropzone.getAttribute('data-tier-id');

                            if (state.tiers[tierId]) {
                                if (state.tiers[tierId].badgeText) {
                                    badge.innerText = state.tiers[tierId].badgeText;
                                }
                                state.tiers[tierId].images.forEach(src => {
                                    dropzone.appendChild(createCard(src));
                                });
                            }
                        });
                    }

                    // Restaura Estoque
                    if (state.pool) {
                        const pool = document.getElementById('imagePool');
                        state.pool.forEach(src => {
                            pool.appendChild(createCard(src));
                        });
                    }
                };
            } catch (e) {
                console.error('Erro ao carregar:', e);
            }
        }

        // ================= CONFIGURAÇÃO GERAL =================

        // Ativa Drag & Drop com auto-save
        const dropzones = document.querySelectorAll('.tier-dropzone, #imagePool');
        dropzones.forEach(zone => {
            new Sortable(zone, {
                group: 'tierlist',
                animation: 150,
                touchStartThreshold: 4,
                ghostClass: 'sortable-ghost',
                onEnd: () => saveAllState() // Salva sempre que mover uma imagem
            });
        });

        // Função para criar o elemento da foto
        function createCard(src) {
            const card = document.createElement('div');
            card.className = 'tier-card';

            const img = document.createElement('img');
            img.src = src;

            const del = document.createElement('button');
            del.className = 'del-btn';
            del.innerText = '×';
            del.onclick = (e) => {
                e.stopPropagation();
                card.remove();
                saveAllState(); // Salva ao deletar
            };

            card.appendChild(img);
            card.appendChild(del);
            return card;
        }

        // Upload de Fotos com auto-save
        const filePicker = document.getElementById('filePicker');
        filePicker.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            let processed = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const card = createCard(event.target.result);
                    document.getElementById('imagePool').appendChild(card);
                    processed++;
                    if (processed === files.length) {
                        saveAllState(); // Salva quando terminar de ler todas
                    }
                };
                reader.readAsDataURL(file);
            });
            filePicker.value = '';
        });

        // Auto-save ao editar textos
        document.querySelectorAll('[contenteditable="true"]').forEach(elem => {
            elem.addEventListener('blur', () => saveAllState());
        });

        // Limpar fotos com limpeza do banco
        document.getElementById('clearBtn').onclick = () => {
            if (confirm('Remover todas as fotos salvas?')) {
                document.querySelectorAll('.tier-card').forEach(el => el.remove());
                saveAllState();
            }
        };

        // Download HD
        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.onclick = () => {
            downloadBtn.innerText = '⏳ Gerando PNG...';
            downloadBtn.disabled = true;

            const deleteButtons = document.querySelectorA
